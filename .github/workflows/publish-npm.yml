name: Publish npm packages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @devkrity/narad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      # Auth is the GitHub OIDC token. Each package needs a trusted publisher
      # on npm for this filename, with direct publish allowed. npm cannot
      # attach that publisher until the package exists, so the first publish
      # is a local login, not this job.
      - name: Publish public packages
        run: pnpm publish -r --access public --no-git-checks
